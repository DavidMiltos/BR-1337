l_english:
 admin_imperial: "Administrative"
 admin_imperial_desc: "An $Administrative Monarchy$ is a [government_type|e] based upon the principle of undivided personal sovereignty, where the [ruler|e] is the first among the elites assisted by numerous bureucrats. The [heir|e] is normally determined by the [dynasty|e] of the $game_concept_monarch$ and in most cases they rule for life.\n\n$game_concept_monarchs$ can use [royal_marriages|e] to secure [alliances|e], and can even inherit foreign [countries|e] through [personal_unions|e]. However, succession is often a troublesome matter, and Monarchies may easily fall into [regencies|e] or under the influence of foreign $game_concept_dynasties$."
 
 admin_imperial_de_jure_law: "De Jure Laws"
 admin_imperial_de_jure_law_desc: "These are the laws that organize the society of our country."
 admin_imperial_by_tradition: "By Tradition"
 admin_imperial_by_tradition_desc: "Customary laws are commonly known and practiced in our country. Famous compilations of medieval customs include #italic De Legibus et Consuetudinibus Angliae#! for England, #italic Sachsenspiegel#! for northern Germany, or the #italic Usatges of Barcelona#! for Catalonia."
 admin_imperial_by_blood: "By Blood"
 admin_imperial_by_blood_desc: "The laws of our country reflect the nature of our people and the sovereign authority of our ruler, as expressed in the famous formula #italic rex in regno suo est imperator regni sui#! - 'The king is emperor in his own kingdom.'"
 admin_imperial_by_edict: "By Edict"
 admin_imperial_by_edict_desc: "The laws of our country reflect the nature of the state as extension of the Monarch, a ruler assigned to rule by god himself."
 #
 admin_imperial_levy_law: "Levy Law"
 admin_imperial_levy_law_desc: "Our army is made up mainly of levies that are recruited from certain [estates|e] of our country, who will fight for us until we disband them."
 admin_imperial_all_cultures: "Inclusive Levies"
 admin_imperial_all_cultures_desc: "Our people will share the burden when there is a call to arms, regardless of their [culture|e] of origin."
 admin_imperial_noble_levies: "Noble Levies"
 admin_imperial_noble_levies_desc: "The [ShowEstateTypeName('nobles_estate')] of our country will lead our calls to arms, since they are the most willing and prepared for war."
 admin_imperial_peasant_levies: "Peasant Levies"
 admin_imperial_peasant_levies_desc: "The [ShowEstateTypeName('peasants_estate')] make up the bulk of our levies, so we must take care to recruit as many as possible when the need arises."
 admin_imperial_militarised_merchants: "Urban Levies"
 admin_imperial_militarised_merchants_desc: "The [ShowEstateTypeName('burghers_estate')] make up a significant portion of our levies, so it is both faster to organise the levy and they are generally better armed."
 admin_imperial_militarised_farmers: "Militarised Farmers"
 admin_imperial_militarised_farmers_desc: "A certain number of the [ShowEstateTypeName('peasants_estate')] are subsidised by the state to upkeep their family's "Martial Traditions" during times of peace, by regularly sparring and upkeeping their equipment"
 #
 admin_imperial_court_customs_law: "Royal Court Customs"
 admin_imperial_court_customs_law_desc: "The traditions and the culture of the court play a significant role in the stability of the Administrative Monarchy. These customs will ensure the safe transition of power from ruler to heir, and limit the court intrigues significantly."
 admin_imperial_aristocratic_court_policy: "Aristocratic Court"
 admin_imperial_aristocratic_court_policy_desc: "The [ShowEstateTypeName('nobles_estate')] are an integral part of our government. In order to better control, reward, and gain support from these ancient aristocratic families, the $nobles_estate$ are tied closely to the monarch and the royal court."
 admin_imperial_balanced_court_policy: "Balanced Court"
 admin_imperial_balanced_court_policy_desc: "The royal court serves as the center of the state and culture. Administrative, diplomatic, and military actions are just as much of a focus of the court as the cultural and internal politics of the state are."
 admin_imperial_court_of_culture_policy: "Court of Culture"
 admin_imperial_court_of_culture_policy_desc: "The court is first and foremost the household of the royal family, and serves as a center of culture and prestige. Governmental and administrative affairs are separated from court life."
 admin_imperial_itinerant_court_policy: "Itinerant Court"
 admin_imperial_itinerant_court_policy_desc: "To better manage the sheer size of our nation, the royal court is not bound to a single location. Instead, it migrates throughout the land and manages local administration on site."
 admin_imperial_harem_policy: "Royal Harem"
 admin_imperial_harem_policy_desc: "Much of our court life is secluded and gender-segregated, centered around a harem where enslaved servants and concubines vie for influence over the ruler."

 admin_imperial_power_law: "Administrative Power"
 admin_imperial_power_law_desc: "As any government, the Administrative Monarchy must not only make decisions, but also act upon them. To do so, it needs a way of exercising its executive capabilities so that they reach even the furthest areas of the country."
 admin_imperial_broad_executive_power_policy: "Broad Executive Power"
 admin_imperial_broad_executive_power_policy_desc: "As our country grows, so does our need to be able to take swift actions. The only way to ensure this is by broadening the powers of the executive branch so that it can do whatever it needs without hindrance."
 admin_imperial_devolution_of_powers_policy: "Devolution Of Powers"
 admin_imperial_devolution_of_powers_policy_desc: "No single person can rule a country as complex as ours. Transferring some of our authority and responsibilities to local governments, which maintaining an ultimate centralized authority, is how we can best meet the needs of our ever-growing state."
 admin_imperial_absolute_presidential_power_policy: "Absolute Power of the Monarch"
 admin_imperial_absolute_presidential_power_policy_desc: "The Role of the Monarch is to be the head guiding the Estates towards prosperity and should not be questioned in this role, only adviseed."
 admin_imperial_new_men_policy: "New Men"
 admin_imperial_new_men_policy_desc: "Those who hold on to power for too long cannot be trusted. Our administration will now focus on raising new bureucrats, ones whose hands are clean of corruption and shady business."
 bureaucratic_offices: "Bureaucratic Offices"
 bureaucratic_offices_desc: "The Bureaucratic Offices represent the hearts of administrative efficiency within your nation, serving as a centralized hub for governance and public administration."
 bureaucratic_offices_maintenance: "Bureaucratic Office Maintenance"
 bureaucrats: "Bureaucrats"
 bureaucrats_literacy_impact: "Average [literacy|e] of [ShowPopTypeName('bureaucrats')]"
